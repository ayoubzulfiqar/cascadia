name: cascadia
description: A Dart CSS selector engine — parse, match and serialize CSS
  Selectors Level 3 and 4 against HTML documents.
version: 0.8.0
homepage: https://github.com/ayoubzulfiqar/cascadia
repository: https://github.com/ayoubzulfiqar/cascadia
issue_tracker: https://github.com/ayoubzulfiqar/cascadia/issues

topics:
  - css
  - selector
  - html
  - dom
  - parser

environment:
  sdk: ">=3.0.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

dependencies:
  html: ^0.15.6

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
