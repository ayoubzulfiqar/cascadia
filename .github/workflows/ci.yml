name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, 3.0.0]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Verify audit defects stay fixed
        run: dart run tool/audit_probe.dart

      - name: Analyze compile-checked README examples
        run: |
          dart pub get -C example
          dart analyze example

      - name: Verify the capability matrix is current
        run: dart run tool/generate_capability_matrix.dart --check

      - name: Check publish archive
        run: dart pub publish --dry-run
